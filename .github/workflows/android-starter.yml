name: Android starter

on:
  push:
    paths:
      - 'androidApp/**'
      - '.github/workflows/android-starter.yml'
  pull_request:
    paths:
      - 'androidApp/**'
      - '.github/workflows/android-starter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: androidApp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default includes the obsolete SDK package "tools".
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :data:testDebugUnitTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: BlackInk-debug
          path: androidApp/app/build/outputs/apk/debug/app-debug.apk
