name: Android starter

on:
  push:
    paths:
      - 'androidApp/**'
      - '.github/workflows/android-starter.yml'
  pull_request:
    paths:
      - 'androidApp/**'
      - '.github/workflows/android-starter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: androidApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :data:testDebugUnitTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: BlackInk-debug
          path: androidApp/app/build/outputs/apk/debug/app-debug.apk
